<script>
/* =============================================================================
   DoAT Aerodrome Standards Portal — client application (SPA)
   Hash-routed single page app. All server calls go through api(action, payload)
   which wraps the central google.script.run.api dispatcher in a Promise.
   ============================================================================= */
(function () {
  'use strict';

  var BOOT = window.BOOTSTRAP || {};
  var App = { boot: BOOT, view: null, lastSearch: null };

  /* ---- server bridge ------------------------------------------------------ */
  function api(action, payload) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) { resolve(res.data); }
          else { reject(new Error(res && res.error ? res.error : 'Request failed')); }
        })
        .withFailureHandler(function (err) { reject(err); })
        .api(action, payload || {});
    });
  }

  /* ---- small helpers ------------------------------------------------------ */
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function badgeClass(t) {
    t = String(t || '').toLowerCase();
    if (t.indexOf('standard') === 0) return 'standard';
    if (t.indexOf('recommended') !== -1) return 'recommended';
    if (t.indexOf('note') !== -1) return 'note';
    if (t.indexOf('definition') !== -1) return 'definition';
    if (t.indexOf('guidance') !== -1 || t.indexOf('procedure') !== -1) return 'guidance';
    return 'other';
  }
  function provisionBadge(t) {
    if (!t || t === 'Unclassified') return '';
    return '<span class="badge ' + badgeClass(t) + '">' + esc(t) + '</span>';
  }
  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast glass-strong ' + (kind || 'info');
    el.innerHTML = (kind === 'ok' ? '✓ ' : kind === 'err' ? '⚠ ' : 'ℹ ') + esc(msg);
    $('#toasts').appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; el.style.transform = 'translateX(30px)'; setTimeout(function () { el.remove(); }, 300); }, kind === 'err' ? 5200 : 3200);
  }
  function loading(target) { (target || $('#view')).innerHTML = '<div class="loading"><div class="spinner"></div> Loading…</div>'; }
  function errorBox(msg) { return '<div class="empty"><div class="big">⚠</div><div>' + esc(msg) + '</div></div>'; }
  function debounce(fn, ms) { var t; return function () { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function () { fn.apply(c, a); }, ms); }; }

  /* ---- modal -------------------------------------------------------------- */
  function openModal(html, wide) {
    var box = $('#modalBox');
    box.className = 'modal glass-strong' + (wide ? ' wide' : '');
    box.innerHTML = '<span class="close" onclick="window.__closeModal()">✕</span>' + html;
    $('#modal-root').classList.add('show');
  }
  window.__closeModal = function () { $('#modal-root').classList.remove('show'); };
  $('#modalBackdrop').addEventListener('click', window.__closeModal);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.__closeModal(); });

  /* ---- navigation --------------------------------------------------------- */
  var NAV = [
    { group: '', items: [
      { id: 'dashboard', label: 'Dashboard', icon: '▦' },
      { id: 'search', label: 'Global Search', icon: '🔍' }
    ]},
    { group: 'Library', items: [
      { id: 'library', label: 'Document Library', icon: '▤' },
      { id: 'knowledge', label: 'Technical Knowledge', icon: '◆' },
      { id: 'glossary', label: 'Technical Glossary', icon: 'Aa' }
    ]},
    { group: 'Research', items: [
      { id: 'ask', label: 'Ask ICAO Reference', icon: '✦' },
      { id: 'versions', label: 'Version Comparison', icon: '⇄' },
      { id: 'recent', label: 'Recently Viewed', icon: '◷' }
    ]},
    { group: 'Workspace', items: [
      { id: 'bookmarks', label: 'Bookmarks & Collections', icon: '★' },
      { id: 'compliance', label: 'Compliance Mapping', icon: '✓', editor: true },
      { id: 'reports', label: 'Reports & Exports', icon: '⤓' }
    ]},
    { group: 'System', items: [
      { id: 'settings', label: 'Settings', icon: '⚙' },
      { id: 'admin', label: 'Administration', icon: '◈', editor: true }
    ]}
  ];

  function renderNav() {
    var html = '';
    NAV.forEach(function (sec) {
      var items = sec.items.filter(function (it) {
        if (it.admin && !BOOT.isAdmin) return false;
        if (it.editor && !BOOT.isEditor) return false;
        return true;
      });
      if (!items.length) return;
      if (sec.group) html += '<div class="nav-group-label">' + sec.group + '</div>';
      items.forEach(function (it) {
        html += '<div class="nav-item" data-route="' + it.id + '"><span class="ic">' + it.icon + '</span>' + esc(it.label) + '</div>';
      });
    });
    $('#nav').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (el) {
      el.addEventListener('click', function () { go(el.getAttribute('data-route')); closeSidebar(); });
    });
  }
  function setActiveNav(route) {
    Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (el) {
      el.classList.toggle('active', el.getAttribute('data-route') === route);
    });
  }

  /* ---- router ------------------------------------------------------------- */
  function go(path) { location.hash = '#/' + path; }
  function parseHash() {
    var h = location.hash.replace(/^#\/?/, '');
    var qIndex = h.indexOf('?');
    var query = {};
    if (qIndex !== -1) {
      h.substring(qIndex + 1).split('&').forEach(function (kv) {
        var p = kv.split('='); query[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
      });
      h = h.substring(0, qIndex);
    }
    var parts = h.split('/').filter(Boolean);
    return { base: parts[0] || 'dashboard', parts: parts, query: query };
  }

  var ROUTES = {
    dashboard: viewDashboard,
    search: viewSearch,
    library: viewLibrary,
    doc: viewDocument,
    section: viewSection,
    knowledge: viewKnowledge,
    subject: viewSubject,
    glossary: viewGlossary,
    ask: viewAsk,
    versions: viewVersions,
    recent: viewRecent,
    bookmarks: viewBookmarks,
    compliance: viewCompliance,
    reports: viewReports,
    settings: viewSettings,
    admin: viewAdmin
  };

  function route() {
    var r = parseHash();
    App.route = r;
    var navId = (r.base === 'doc' || r.base === 'section') ? 'library' : r.base;
    setActiveNav(ROUTES[r.base] ? r.base : navId);
    var fn = ROUTES[r.base] || viewDashboard;
    try { fn(r); } catch (e) { $('#view').innerHTML = errorBox(e.message); }
    window.scrollTo(0, 0);
  }

  /* ======================================================================== *
   *  VIEWS
   * ======================================================================== */

  /* ---- Dashboard ---------------------------------------------------------- */
  function viewDashboard() {
    loading();
    Promise.all([
      api('dashboard.stats'), api('dashboard.recent'), api('dashboard.frequent'), api('docs.list', {})
    ]).then(function (res) {
      var stats = res[0], recent = res[1], freq = res[2], docs = res[3];
      var h = '';
      h += '<div class="page-title">Welcome' + (BOOT.user ? ', ' + esc(BOOT.user.displayName) : '') + '</div>';
      h += '<div class="page-sub">Search, retrieve and cross-reference aerodrome standards and technical guidance.</div>';

      // hero search
      h += '<div class="glass card" style="margin-bottom:22px;">'
         + '<div style="position:relative;">'
         + '<input id="heroSearch" type="text" placeholder="Search ICAO Annex 14, Doc 9157, provisions, technical specifications…" '
         + 'style="height:48px;border-radius:999px;padding:0 18px;font-size:15px;">'
         + '</div>'
         + '<div class="pill-row" style="margin-top:14px;">'
         + BOOT.quickAccess.slice(0, 10).map(function (q) { return '<span class="chip" data-qa="' + esc(q) + '">' + esc(q) + '</span>'; }).join('')
         + '</div></div>';

      // stats
      h += '<div class="section-title">Library Statistics</div>';
      h += '<div class="grid cols-4">'
         + stat('▤', stats.totalDocuments, 'Documents in catalogue')
         + stat('✓', stats.indexedDocuments, 'Indexed documents')
         + stat('▦', stats.totalIndexedPages, 'Indexed pages')
         + stat('◆', stats.totalSections, 'Searchable sections')
         + stat('🔍', stats.totalSearchChunks, 'Search index entries')
         + stat('★', stats.totalBookmarks, 'Bookmarks')
         + stat('◷', stats.lastIndexDate || '—', 'Last indexing')
         + stat('⚠', stats.indexingErrors, 'Indexing errors')
         + '</div>';

      // document library preview
      h += '<div class="section-title" style="display:flex;justify-content:space-between;"><span>Document Library</span>'
         + '<span class="chip" data-route="library">View all →</span></div>';
      h += '<div class="grid auto">' + docs.slice(0, 6).map(docCard).join('') + '</div>';

      // recent + frequent
      h += '<div class="grid cols-2" style="margin-top:8px;">';
      h += '<div><div class="section-title">Recently Accessed</div>' + recentList(recent) + '</div>';
      h += '<div><div class="section-title">Frequently Used References</div>' + freqList(freq) + '</div>';
      h += '</div>';

      h += disclaimerBox();
      $('#view').innerHTML = h;
      wireDashboard();
    }).catch(function (e) { $('#view').innerHTML = errorBox(e.message); });
  }

  function stat(ic, v, l) {
    return '<div class="glass stat"><div class="ic">' + ic + '</div><div class="v">' + esc(v) + '</div><div class="l">' + esc(l) + '</div></div>';
  }
  function recentList(recent) {
    if (!recent || !recent.length) return '<div class="glass card muted" style="font-size:13px;">No recent activity yet.</div>';
    return '<div class="glass card">' + recent.slice(0, 8).map(function (r) {
      return '<div class="toc-item" data-section="' + esc(r.id) + '">◷ ' + esc(r.label || r.id) + '</div>';
    }).join('') + '</div>';
  }
  function freqList(freq) {
    if (!freq || !freq.length) return '<div class="glass card muted" style="font-size:13px;">Usage tracking disabled or no data yet. Administrators can enable it in Settings.</div>';
    return '<div class="glass card">' + freq.map(function (r) {
      return '<div class="toc-item" data-section="' + esc(r.id) + '">★ ' + esc(r.label || r.id) + ' <span class="muted">(' + r.count + ')</span></div>';
    }).join('') + '</div>';
  }
  function wireDashboard() {
    var hero = $('#heroSearch');
    if (hero) hero.addEventListener('keydown', function (e) { if (e.key === 'Enter' && hero.value.trim()) go('search?q=' + encodeURIComponent(hero.value.trim())); });
    bindData('[data-qa]', 'data-qa', function (v) { go('search?q=' + encodeURIComponent(v)); });
    bindData('[data-route]', 'data-route', function (v) { go(v); });
    bindData('[data-section]', 'data-section', function (v) { go('section/' + encodeURIComponent(v)); });
    bindDocCards();
  }
  function bindData(sel, attr, fn) {
    Array.prototype.forEach.call(document.querySelectorAll(sel), function (el) {
      if (el.__bound) return; el.__bound = true;
      el.addEventListener('click', function (e) { e.stopPropagation(); fn(el.getAttribute(attr)); });
    });
  }

  /* ---- document card ------------------------------------------------------ */
  function docCard(d) {
    var statusBadge = '<span class="badge status">' + esc(d.indexingStatus) + '</span>';
    var vp = [d.volume, d.part].filter(Boolean).join(' · ');
    return '<div class="glass doc-card">'
      + '<div class="top"><span class="num">' + esc(d.number) + '</span>' + statusBadge + '</div>'
      + '<div class="title">' + esc(d.title) + '</div>'
      + '<div class="meta">' + (vp ? '<span>' + esc(vp) + '</span>' : '') + (d.edition ? '<span>' + esc(d.edition) + '</span>' : '') + '</div>'
      + '<div class="meta"><span>' + (d.sections || 0) + ' sections</span><span>' + (d.indexedPages || 0) + '/' + (d.totalPages || 0) + ' pages</span>'
      + '<span class="badge status">' + esc(d.status) + '</span></div>'
      + '<div class="actions">'
      + '<button class="btn sm" data-browse="' + d.documentId + '">Browse</button>'
      + '<button class="btn sm ghost" data-search-in="' + d.documentId + '">Search within</button>'
      + '</div></div>';
  }
  function bindDocCards() {
    bindData('[data-browse]', 'data-browse', function (v) { go('doc/' + v); });
    bindData('[data-search-in]', 'data-search-in', function (v) { go('search?doc=' + v); });
  }

  /* ---- Global Search ------------------------------------------------------ */
  function viewSearch(r) {
    var q = r.query.q || '';
    var docFilter = r.query.doc || '';
    var h = '';
    h += '<div class="page-title">Global Search</div>';
    h += '<div class="page-sub">Searches every indexed document simultaneously. Use "quotes" for phrases, AND / OR / NOT, or a paragraph number such as 3.4.1.</div>';
    h += '<div class="glass filters" id="filterPanel"></div>';
    h += '<div id="searchMeta" class="page-sub" style="margin:0 0 10px;"></div>';
    h += '<div id="searchResults"></div>';
    $('#view').innerHTML = h;
    renderFilters(docFilter);
    if (q || docFilter) { $('#globalSearch').value = q; runSearch(1); }
    else { $('#searchResults').innerHTML = '<div class="empty"><div class="big">🔍</div><div>Enter a search term above to begin.</div></div>'; }
  }

  var SEARCH_STATE = { query: '', filters: {}, sort: 'relevance', page: 1 };

  function renderFilters(docFilter) {
    api('docs.list', {}).then(function (docs) {
      var docOpts = '<option value="">All documents</option>' + docs.map(function (d) {
        return '<option value="' + d.documentId + '"' + (d.documentId === docFilter ? ' selected' : '') + '>' + esc(d.number + ' ' + (d.volume || d.part || '')) + '</option>';
      }).join('');
      var typeOpts = '<option value="">Any type</option>' + BOOT.provisionTypes.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('');
      var html = '<div class="row">'
        + field('Document', '<select id="f-doc">' + docOpts + '</select>')
        + field('Provision type', '<select id="f-type">' + typeOpts + '</select>')
        + field('Chapter contains', '<input type="text" id="f-chapter" placeholder="e.g. Chapter 3">')
        + field('Page from', '<input type="number" id="f-pageFrom" min="1">')
        + field('Page to', '<input type="number" id="f-pageTo" min="1">')
        + field('Sort by', '<select id="f-sort"><option value="relevance">Relevance</option><option value="document">Document</option><option value="section">Section</option><option value="page">Page</option></select>')
        + '</div>'
        + '<div style="margin-top:12px;display:flex;gap:10px;"><button class="btn primary sm" id="applyFilters">Apply</button>'
        + '<button class="btn ghost sm" id="clearFilters">Clear</button>'
        + '<label class="field" style="flex-direction:row;align-items:center;gap:6px;margin-left:8px;"><input type="checkbox" id="f-current" style="width:auto;"> Current editions only</label></div>';
      $('#filterPanel').innerHTML = html;
      if (docFilter) $('#f-doc').value = docFilter;
      $('#applyFilters').addEventListener('click', function () { SEARCH_STATE.query = $('#globalSearch').value.trim(); runSearch(1); });
      $('#clearFilters').addEventListener('click', function () {
        ['f-doc','f-type','f-chapter','f-pageFrom','f-pageTo'].forEach(function (id) { $('#' + id).value = ''; });
        $('#f-current').checked = false; runSearch(1);
      });
    });
  }
  function field(label, inner) { return '<label class="field">' + esc(label) + inner + '</label>'; }

  function collectFilters() {
    function v(id) { var el = $('#' + id); return el ? el.value.trim() : ''; }
    var f = {};
    if (v('f-doc')) f.documentId = v('f-doc');
    if (v('f-type')) f.provisionType = v('f-type');
    if (v('f-chapter')) f.chapter = v('f-chapter');
    if (v('f-pageFrom')) f.pageFrom = v('f-pageFrom');
    if (v('f-pageTo')) f.pageTo = v('f-pageTo');
    if ($('#f-current') && $('#f-current').checked) f.statusCurrentOnly = true;
    return f;
  }

  function runSearch(page) {
    SEARCH_STATE.query = $('#globalSearch').value.trim() || SEARCH_STATE.query;
    SEARCH_STATE.filters = collectFilters();
    SEARCH_STATE.sort = ($('#f-sort') && $('#f-sort').value) || 'relevance';
    SEARCH_STATE.page = page || 1;
    var results = $('#searchResults');
    if (results) loading(results);
    api('search.run', { query: SEARCH_STATE.query, filters: SEARCH_STATE.filters, sort: SEARCH_STATE.sort, page: SEARCH_STATE.page })
      .then(renderSearchResults)
      .catch(function (e) { if (results) results.innerHTML = errorBox(e.message); });
  }

  function renderSearchResults(res) {
    App.lastSearch = res;
    var meta = $('#searchMeta');
    if (meta) meta.innerHTML = res.total ? ('<b>' + res.total + '</b> result' + (res.total === 1 ? '' : 's') + ' · ' + res.took + ' ms') : '';
    var box = $('#searchResults');
    if (!res.total) {
      box.innerHTML = '<div class="empty"><div class="big">∅</div><div>No results found' + (res.message ? '. ' + esc(res.message) : '.') + '</div>'
        + '<div class="muted" style="margin-top:8px;font-size:13px;">Only indexed documents are searchable. Try different terms, or check indexing status in the Library.</div></div>';
      return;
    }
    var h = res.results.map(resultCard).join('');
    var pages = Math.ceil(res.total / res.pageSize);
    if (pages > 1) {
      h += '<div class="pager">'
        + '<button class="btn sm ghost" ' + (res.page <= 1 ? 'disabled' : '') + ' id="prevPage">← Prev</button>'
        + '<span class="muted">Page ' + res.page + ' of ' + pages + '</span>'
        + '<button class="btn sm ghost" ' + (res.page >= pages ? 'disabled' : '') + ' id="nextPage">Next →</button></div>';
    }
    box.innerHTML = h;
    bindData('.result', 'data-section', function (v) { go('section/' + encodeURIComponent(v)); });
    if ($('#prevPage')) $('#prevPage').addEventListener('click', function () { runSearch(res.page - 1); });
    if ($('#nextPage')) $('#nextPage').addEventListener('click', function () { runSearch(res.page + 1); });
    bindResultActions();
  }

  function resultCard(r) {
    var ref = [r.chapter, r.paragraph ? ('¶ ' + r.paragraph) : '', r.page ? ('p.' + r.page) : ''].filter(Boolean).join(' · ');
    var ocr = r.ocr && r.ocr.indexOf('OCR') !== -1 ? '<span class="badge status" title="OCR-derived — verify">OCR</span>' : '';
    return '<div class="glass result" data-section="' + esc(r.sectionId) + '">'
      + '<div class="r-top"><span class="r-doc">' + esc(r.documentNumber) + (r.volume || r.part ? ' · ' + esc(r.volume || r.part) : '') + '</span>'
      + provisionBadge(r.provisionType) + ocr + '<span class="r-ref">' + esc(ref) + '</span></div>'
      + '<div class="r-head">' + esc(r.heading || r.paragraph || 'Provision') + '</div>'
      + '<div class="r-snip">' + (r.snippet || '') + '</div>'
      + '<div class="r-foot"><span>' + esc(r.documentTitle) + '</span>'
      + '<span class="sp">'
      + '<button class="btn sm ghost" data-bookmark="' + esc(r.sectionId) + '" title="Bookmark">★</button>'
      + '<button class="btn sm ghost" data-cite="' + esc(r.sectionId) + '" title="Copy reference">⧉</button>'
      + '<button class="btn sm" data-open="' + esc(r.sectionId) + '">Open</button>'
      + '</span></div></div>';
  }
  function bindResultActions() {
    bindData('[data-open]', 'data-open', function (v) { go('section/' + encodeURIComponent(v)); });
    bindData('[data-bookmark]', 'data-bookmark', function (v) { quickBookmark(v); });
    bindData('[data-cite]', 'data-cite', function (v) { copyCitation(v); });
  }

  /* ---- Library ------------------------------------------------------------ */
  function viewLibrary() {
    loading();
    api('docs.list', { includeArchived: true }).then(function (docs) {
      var byNumber = {};
      docs.forEach(function (d) { (byNumber[d.number] = byNumber[d.number] || []).push(d); });
      var h = '<div class="page-title">Document Library</div><div class="page-sub">Primary reference library. Browse or search within any document.</div>';
      Object.keys(byNumber).sort().forEach(function (num) {
        h += '<div class="section-title">' + esc(num) + '</div>';
        h += '<div class="grid auto">' + byNumber[num].map(docCard).join('') + '</div>';
      });
      h += disclaimerBox();
      $('#view').innerHTML = h;
      bindDocCards();
    }).catch(function (e) { $('#view').innerHTML = errorBox(e.message); });
  }

  /* ---- Document viewer ---------------------------------------------------- */
  function viewDocument(r) {
    var id = r.parts[1];
    loading();
    Promise.all([api('docs.get', { documentId: id }), api('docs.sections', { documentId: id })]).then(function (res) {
      var d = res[0], secs = res[1];
      var h = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">'
        + '<div><div class="page-title">' + esc(d.title) + '</div>'
        + '<div class="page-sub">' + esc([d.number, d.volume, d.part, d.edition].filter(Boolean).join(' · ')) + '</div></div>'
        + '<div style="display:flex;gap:8px;">'
        + (d.hasFile ? '<button class="btn" id="openDrive">Open in Drive ↗</button>' : '')
        + '<button class="btn" data-search-in="' + d.documentId + '">Search within</button></div></div>';

      h += '<div class="notice" style="margin-bottom:16px;">Indexing: <b>' + esc(d.indexingStatus) + '</b> · ' + (d.indexedPages || 0) + '/' + (d.totalPages || 0) + ' pages · ' + (secs.length) + ' sections.'
        + (d.indexingStatus !== 'Complete' ? ' Some content may not yet be searchable.' : '') + '</div>';

      h += '<div class="viewer-grid">';
      h += '<div class="glass toc"><div style="font-weight:650;margin-bottom:8px;">Contents</div>';
      if (!secs.length) { h += '<div class="muted" style="font-size:12.5px;">Not yet indexed. An administrator can run indexing from Administration.</div>'; }
      else {
        var lastChapter = '';
        secs.forEach(function (s) {
          if (s.chapter && s.chapter !== lastChapter) { lastChapter = s.chapter; h += '<div style="font-weight:600;font-size:11.5px;margin:10px 0 2px;color:var(--text-faint);">' + esc(s.chapter) + '</div>'; }
          h += '<div class="toc-item" data-section="' + esc(s.sectionId) + '">' + (s.paragraph ? '<b>' + esc(s.paragraph) + '</b> ' : '') + esc(s.heading || '(section)') + '</div>';
        });
      }
      h += '</div>';

      // viewer pane: embed PDF if available
      h += '<div class="glass" style="padding:10px;">';
      if (d.hasFile) {
        h += '<iframe class="pdf-frame" src="https://drive.google.com/file/d/' + esc(d.driveFileId) + '/preview" allow="autoplay"></iframe>'
          + '<div class="muted" style="font-size:11.5px;margin-top:8px;padding:0 4px;">If the embedded viewer is blocked by Drive permissions, use “Open in Drive”. Direct paragraph highlighting inside the PDF is not supported; use the Contents list and section view for precise navigation.</div>';
      } else {
        h += '<div class="empty"><div class="big">▤</div><div>No PDF linked to this document yet.</div>'
          + (BOOT.isEditor ? '<div class="muted" style="margin-top:8px;">Link a Drive file in Administration → Documents.</div>' : '') + '</div>';
      }
      h += '</div></div>';

      $('#view').innerHTML = h;
      bindData('[data-section]', 'data-section', function (v) { go('section/' + encodeURIComponent(v)); });
      bindData('[data-search-in]', 'data-search-in', function (v) { go('search?doc=' + v); });
      if ($('#openDrive')) $('#openDrive').addEventListener('click', function () { window.open('https://drive.google.com/file/d/' + d.driveFileId + '/view', '_blank'); });
    }).catch(function (e) { $('#view').innerHTML = errorBox(e.message); });
  }

  /* ---- Section detail ----------------------------------------------------- */
  function viewSection(r) {
    var id = r.parts[1];
    loading();
    api('docs.section', { sectionId: id }).then(function (s) {
      var xr = s.crossReferences || { direct: [], related: [], suggested: [], empty: true };
      var ocrNote = s.ocr && s.ocr.indexOf('OCR') !== -1
        ? '<div class="notice" style="margin-bottom:14px;border-left-color:var(--t-recommended);background:color-mix(in srgb,var(--t-recommended) 12%,transparent);">⚠ This text is OCR-derived and has not been verified. Confirm wording against the original PDF.</div>' : '';
      var h = '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">'
        + '<button class="btn sm ghost" onclick="history.back()">← Back</button>'
        + (s.prev ? '<button class="btn sm ghost" data-section="' + esc(s.prev.sectionId) + '">↑ Previous</button>' : '')
        + (s.next ? '<button class="btn sm ghost" data-section="' + esc(s.next.sectionId) + '">Next ↓</button>' : '')
        + '</div>';

      h += '<div class="viewer-grid">';
      // main
      h += '<div style="order:2;" class="glass card">';
      h += '<div class="r-top" style="margin-bottom:10px;"><span class="r-doc">' + esc(s.documentNumber) + (s.volume || s.part ? ' · ' + esc(s.volume || s.part) : '') + '</span>' + provisionBadge(s.provisionType) + '</div>';
      h += '<div class="page-title" style="font-size:20px;">' + (s.paragraph ? '<span style="color:var(--accent);">' + esc(s.paragraph) + '</span> ' : '') + esc(s.heading || 'Provision') + '</div>';
      h += '<div class="page-sub">' + esc([s.chapter, s.edition, s.startPage ? 'PDF page ' + s.startPage : ''].filter(Boolean).join(' · ')) + '</div>';
      h += ocrNote;
      h += '<div class="detail-text">' + esc(s.text) + '</div>';
      h += '<div class="glass" style="margin-top:16px;padding:12px 14px;font-size:12.5px;"><b>Citation</b><br>' + esc(s.citation) + '</div>';
      h += '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">'
        + '<button class="btn sm" data-bookmark="' + esc(s.sectionId) + '">★ Bookmark</button>'
        + '<button class="btn sm ghost" data-cite="' + esc(s.sectionId) + '">⧉ Copy citation</button>'
        + '<button class="btn sm ghost" id="noteBtn">✎ Add note</button>'
        + (s.driveFileId ? '<button class="btn sm ghost" id="openPdf">Open PDF ↗</button>' : '')
        + '<button class="btn sm ghost" id="printBtn">⤓ Print / export</button>'
        + (BOOT.isEditor ? '<button class="btn sm ghost" id="toCompliance">+ Compliance register</button>' : '')
        + '</div>';
      h += '<div id="notesArea" style="margin-top:14px;"></div>';
      h += '</div>';

      // side: cross references + related subjects
      h += '<div style="order:1;" class="glass card">';
      h += '<div style="font-weight:650;margin-bottom:8px;">Cross-references</div>';
      h += xrefGroup('Direct references', xr.direct, 'direct');
      h += xrefGroup('Related provisions', xr.related, 'related');
      h += xrefGroup('Suggested (algorithmic)', xr.suggested, 'suggested');
      if (xr.empty) h += '<div class="muted" style="font-size:12.5px;">No related reference identified.</div>';
      if (s.subject) h += '<div style="margin-top:14px;"><div style="font-weight:650;margin-bottom:6px;">Related topic</div><span class="chip" data-subject="' + esc(s.subject) + '">◆ ' + esc(s.subject) + '</span></div>';
      h += '</div>';

      h += '</div>';
      $('#view').innerHTML = h;

      bindData('[data-section]', 'data-section', function (v) { go('section/' + encodeURIComponent(v)); });
      bindData('[data-xref]', 'data-xref', function (v) { if (v) go('section/' + encodeURIComponent(v)); });
      bindData('[data-subject]', 'data-subject', function (v) { go('subject/' + encodeURIComponent(v)); });
      bindData('[data-bookmark]', 'data-bookmark', function (v) { quickBookmark(v); });
      bindData('[data-cite]', 'data-cite', function (v) { copyCitation(v); });
      if ($('#openPdf')) $('#openPdf').addEventListener('click', function () { window.open('https://drive.google.com/file/d/' + s.driveFileId + '/view', '_blank'); });
      if ($('#noteBtn')) $('#noteBtn').addEventListener('click', function () { openNoteModal(s); });
      if ($('#printBtn')) $('#printBtn').addEventListener('click', function () { printSection(s.sectionId); });
      if ($('#toCompliance')) $('#toCompliance').addEventListener('click', function () { openComplianceModal(s.sectionId); });
      loadNotes(s.sectionId);
    }).catch(function (e) { $('#view').innerHTML = errorBox(e.message); });
  }

  function xrefGroup(title, list, cls) {
    if (!list || !list.length) return '';
    return '<div style="margin-bottom:10px;"><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;">' + esc(title) + '</div>'
      + list.map(function (x) {
        return '<div class="xref-item ' + cls + '" data-xref="' + esc(x.targetSectionId || '') + '">'
          + '<div class="tt">' + esc(x.type) + (x.verification ? ' · ' + esc(x.verification) : '') + '</div>'
          + esc(x.targetDocumentTitle || x.label || 'Reference')
          + (x.targetParagraph ? ' ¶ ' + esc(x.targetParagraph) : '') + '</div>';
      }).join('') + '</div>';
  }

  function loadNotes(sectionId) {
    api('notes.list', { sectionId: sectionId }).then(function (notes) {
      if (!notes.length) { $('#notesArea').innerHTML = ''; return; }
      $('#notesArea').innerHTML = '<div style="font-weight:650;margin-bottom:8px;">Your notes</div>' + notes.map(function (n) {
        return '<div class="glass" style="padding:10px 12px;margin-bottom:8px;font-size:13px;">' + esc(n.text)
          + (n.tags.length ? '<div class="pill-row" style="margin-top:6px;">' + n.tags.map(function (t) { return '<span class="badge status">' + esc(t) + '</span>'; }).join('') + '</div>' : '')
          + '<div style="margin-top:6px;"><button class="btn sm ghost" data-delnote="' + n.noteId + '">Delete</button></div></div>';
      }).join('');
      bindData('[data-delnote]', 'data-delnote', function (v) { api('notes.remove', { noteId: v }).then(function () { toast('Note deleted', 'ok'); loadNotes(sectionId); }); });

  function openNoteModal(s) {
    openModal('<h2>Add note</h2><p class="muted" style="font-size:13px;">Private to you. Stored separately from the ICAO source text.</p>'
      + '<label class="field" style="margin-top:12px;">Note<textarea id="noteText"></textarea></label>'
      + '<label class="field" style="margin-top:10px;">Tags (comma separated)<input type="text" id="noteTags" placeholder="runway, inspection"></label>'
      + '<div class="foot"><button class="btn ghost" onclick="window.__closeModal()">Cancel</button><button class="btn primary" id="saveNote">Save note</button></div>');
    $('#saveNote').addEventListener('click', function () {
      var text = $('#noteText').value.trim(); if (!text) { toast('Enter note text', 'err'); return; }
      api('notes.save', { sectionId: s.sectionId, documentId: s.documentId, text: text, tags: $('#noteTags').value.split(',').map(function (t) { return t.trim(); }).filter(Boolean) })
        .then(function () { window.__closeModal(); toast('Note saved', 'ok'); loadNotes(s.sectionId); })
        .catch(function (e) { toast(e.message, 'err'); });
    });

            + '<div class="r-head">' + esc(it.heading || 'Provision') + '</div>'

  /* ---- Ask ICAO Reference ------------------------------------------------- */
  function viewAsk() {
    var h = '<div class="page-title">Ask ICAO Reference</div>'
      + '<div class="page-sub">A source-based assistant. It retrieves the most relevant indexed passages and cites them — it does not generate requirements or substitute external knowledge.</div>'
      + '<div class="glass card"><div style="display:flex;gap:10px;">'
      + '<input type="text" id="askInput" placeholder="e.g. What are the requirements for runway strip width?" style="height:46px;">'
      + '<button class="btn primary" id="askBtn">Ask</button></div>'
      + '<div class="pill-row" style="margin-top:12px;">'
      + ['What are the requirements for a runway strip?', 'Guidance for taxiway shoulder design?', 'How are rescue and firefighting categories determined?', 'What does Annex 14 state about RESA?']
          .map(function (q) { return '<span class="chip" data-ask="' + esc(q) + '">' + esc(q) + '</span>'; }).join('')
      + '</div></div><div id="askResult" style="margin-top:16px;"></div>';
    $('#view').innerHTML = h;
    $('#askBtn').addEventListener('click', function () { doAsk($('#askInput').value.trim()); });
    $('#askInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') doAsk($('#askInput').value.trim()); });
    bindData('[data-ask]', 'data-ask', function (v) { $('#askInput').value = v; doAsk(v); });
  }
  function doAsk(q) {
    if (!q) return;
    loading($('#askResult'));
    api('ask.query', { question: q }).then(function (res) {
      if (!res.answered) { $('#askResult').innerHTML = '<div class="notice">' + esc(res.message) + '</div>'; return; }
      var h = '<div class="glass card"><div style="font-weight:650;margin-bottom:6px;">Overview <span class="badge status">assembled from retrieved passages</span></div>'
        + '<div style="font-size:13.5px;color:var(--text-soft);">' + esc(res.overview) + '</div></div>';
      h += '<div class="section-title">Source passages</div>';
      h += res.passages.map(function (p) {
        return '<div class="glass result" data-section="' + esc(p.sectionId) + '">'
          + '<div class="r-top"><span class="r-doc">' + esc(p.documentTitle) + '</span>' + provisionBadge(p.provisionType)
          + (p.ocr && p.ocr.indexOf('OCR') !== -1 ? '<span class="badge status">OCR</span>' : '') + '</div>'
          + '<div class="r-head">' + esc(p.heading || p.paragraph || 'Passage') + '</div>'
          + '<div class="r-snip">' + esc(p.excerpt) + '</div>'
          + '<div class="r-foot"><span>' + esc(p.citation) + '</span></div></div>';
      }).join('');
      h += '<div class="notice" style="margin-top:14px;">' + esc(res.disclaimer) + '</div>';
      $('#askResult').innerHTML = h;
      bindData('.result', 'data-section', function (v) { go('section/' + encodeURIComponent(v)); });
    }).catch(function (e) { $('#askResult').innerHTML = errorBox(e.message); });
  }

  function viewGlossary() {
    var h = '<div class="page-title">Technical Glossary</div>'
      + '<div class="page-sub">Definitions harvested from indexed documents. Verbatim source definitions are marked.</div>'

          return '<div style="padding:9px 0;border-bottom:1px solid var(--line);"><b>' + esc(r.term) + '</b> '

  /* ---- Version comparison ------------------------------------------------- */
  function viewVersions() {
    loading();
    api('version.sets').then(function (sets) {
      var h = '<div class="page-title">Version Comparison</div>'
        + '<div class="page-sub">Compare two indexed editions of the same document by paragraph number. Paragraph numbers are not assumed stable between editions.</div>';
      if (!sets.length) { h += '<div class="empty"><div class="big">⇄</div><div>No document has two or more indexed editions available for comparison.</div></div>'; $('#view').innerHTML = h; return; }
      sets.forEach(function (set, i) {
        var opts = set.editions.map(function (e) { return '<option value="' + e.documentId + '">' + esc(e.edition || 'Edition') + ' (' + esc(e.indexed) + ')</option>'; }).join('');
        h += '<div class="glass card" style="margin-bottom:14px;"><div style="font-weight:650;">' + esc(set.title) + '</div>'
          + '<div class="row" style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:10px;align-items:end;">'
          + '<label class="field">Edition A<select id="va' + i + '">' + opts + '</select></label>'
          + '<label class="field">Edition B<select id="vb' + i + '">' + opts + '</select></label>'
          + '<button class="btn primary" data-compare="' + i + '">Compare</button></div>'
          + '<div id="vres' + i + '" style="margin-top:12px;"></div></div>';
      });
      $('#view').innerHTML = h;
      bindData('[data-compare]', 'data-compare', function (i) {
        var a = $('#va' + i).value, b = $('#vb' + i).value;
        if (a === b) { toast('Choose two different editions', 'err'); return; }
        loading($('#vres' + i));
        api('version.compare', { docIdA: a, docIdB: b }).then(function (res) { renderCompare($('#vres' + i), res); }).catch(function (e) { $('#vres' + i).innerHTML = errorBox(e.message); });
      });
    }).catch(function (e) { $('#view').innerHTML = errorBox(e.message); });
  }
  function renderCompare(box, res) {
    var h = '<div class="notice">' + esc(res.summary) + '</div>';
    if (res.modified.length) {
      h += '<div class="section-title">Modified paragraphs</div>';
      res.modified.slice(0, 40).forEach(function (m) {
        h += '<div class="glass card" style="margin-bottom:8px;"><b>¶ ' + esc(m.paragraph) + '</b> ' + esc(m.heading) + ' <span class="badge status">' + m.similarity + '% similar</span>'
          + '<div class="grid cols-2" style="margin-top:8px;"><div><div class="muted" style="font-size:11px;">' + esc(res.editionA.edition) + '</div><div style="font-size:12.5px;">' + esc(m.before) + '</div></div>'
          + '<div><div class="muted" style="font-size:11px;">' + esc(res.editionB.edition) + '</div><div style="font-size:12.5px;">' + esc(m.after) + '</div></div></div></div>';
      });
    }
    function listBlock(title, arr) {
      if (!arr.length) return '';
      return '<div class="section-title">' + title + ' (' + arr.length + ')</div><div class="glass card">' + arr.slice(0, 40).map(function (a) {
        return '<div style="padding:6px 0;border-bottom:1px solid var(--line);"><b>¶ ' + esc(a.paragraph) + '</b> ' + esc(a.heading) + '</div>';
      }).join('') + '</div>';
    }
    h += listBlock('Added in ' + esc(res.editionB.edition), res.added);
    h += listBlock('Removed from ' + esc(res.editionA.edition), res.removed);
    box.innerHTML = h;
  }

      if ($('#addManual')) $('#addManual').addEventListener('click', function () { openComplianceModal(null); });
      if ($('#exportCmp')) $('#exportCmp').addEventListener('click', function () { api('export.complianceCsv', { filters: {} }).then(function (r) { downloadText(r.filename, r.csv); }); });

  function complianceTable(rows) {
    if (!rows.length) return '<div class="empty"><div class="big">✓</div><div>No compliance records yet.</div></div>';
    var h = '<div class="glass table-wrap"><table class="data"><thead><tr><th>Source</th><th>¶</th><th>Type</th><th>National reg.</th><th>Responsible</th><th>Status</th><th>Target</th><th></th></tr></thead><tbody>';
    rows.forEach(function (r) {
      h += '<tr><td>' + esc(r.documentTitle || '—') + '</td><td>' + esc(r.paragraph) + '</td><td>' + provisionBadge(r.provisionType) + '</td>'
        + '<td>' + esc(r.nationalRegulation) + '</td><td>' + esc(r.responsibleUnit) + '</td>'
        + '<td><span class="badge status">' + esc(r.complianceStatus) + '</span></td><td>' + esc(r.targetDate) + '</td>'
        + '<td style="white-space:nowrap;"><button class="btn sm ghost" data-editcmp="' + r.referenceId + '">Edit</button> <button class="btn sm ghost" data-delcmp="' + r.referenceId + '">✕</button></td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  function pollIndex(docId, p) {
    var prog = $('#prog-' + docId);
    if (p && prog) {
      var pct = p.totalSections ? Math.round((p.indexedSections / p.totalSections) * 100) : 0;
      prog.innerHTML = '<div class="progress" style="margin-top:6px;"><span style="width:' + pct + '%"></span></div><span class="muted" style="font-size:11px;">' + (p.indexedSections || 0) + '/' + (p.totalSections || 0) + ' sections</span>';
    }
    if (p && p.status && p.status !== 'Processing') { toast('Indexing ' + p.status.toLowerCase() + (p.lowQuality ? ' — ' + p.lowQuality + ' low-quality section(s) flagged' : ''), p.status === 'Failed' ? 'err' : 'ok'); setTimeout(viewAdmin, 900); return; }

  /* ---- global search bar + shortcuts -------------------------------------- */
  function wireGlobalSearch() {
    var input = $('#globalSearch');
    var pop = $('#suggestPop');
    var hlIndex = -1, items = [];
    var doSuggest = debounce(function () {
      var v = input.value.trim();
      if (v.length < 2) { pop.classList.remove('show'); return; }
      api('search.suggest', { prefix: v }).then(function (sug) {
        api('search.history').then(function (hist) {
          items = [];
          var html = '';
          if (hist && hist.length) {
            html += '<div class="muted">Recent</div>';
            hist.slice(0, 4).forEach(function (h) { items.push(h.q); html += '<div class="item" data-sug="' + esc(h.q) + '">🕑 ' + esc(h.q) + '</div>'; });
          }
          if (sug && sug.length) {
            html += '<div class="muted">Suggestions</div>';
            sug.forEach(function (s) { var q = s.split(' — ')[0]; items.push(q); html += '<div class="item" data-sug="' + esc(q) + '">' + esc(s) + '</div>'; });
          }
          pop.innerHTML = html || '<div class="muted">No suggestions</div>';
          pop.classList.add('show');
          Array.prototype.forEach.call(pop.querySelectorAll('[data-sug]'), function (el) {
            el.addEventListener('mousedown', function (e) { e.preventDefault(); input.value = el.getAttribute('data-sug'); pop.classList.remove('show'); submitGlobal(); });
          });
        });
      });
    }, 180);
    input.addEventListener('input', function () { hlIndex = -1; doSuggest(); });
    input.addEventListener('focus', function () { if (input.value.trim().length >= 2) doSuggest(); });
    input.addEventListener('blur', function () { setTimeout(function () { pop.classList.remove('show'); }, 150); });
    input.addEventListener('keydown', function (e) {
      var nodes = pop.querySelectorAll('.item');
      if (e.key === 'ArrowDown') { e.preventDefault(); hlIndex = Math.min(hlIndex + 1, nodes.length - 1); hl(nodes); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); hlIndex = Math.max(hlIndex - 1, 0); hl(nodes); }
      else if (e.key === 'Enter') { if (hlIndex >= 0 && nodes[hlIndex]) { input.value = nodes[hlIndex].getAttribute('data-sug'); } pop.classList.remove('show'); submitGlobal(); }
      else if (e.key === 'Escape') { pop.classList.remove('show'); }
    });
    function hl(nodes) { Array.prototype.forEach.call(nodes, function (n, i) { n.classList.toggle('hl', i === hlIndex); }); }
    function submitGlobal() { var v = input.value.trim(); if (v) go('search?q=' + encodeURIComponent(v)); }

    document.addEventListener('keydown', function (e) {
      if ((e.key === '/' || (e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey)))) {
        var tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        e.preventDefault(); input.focus(); input.select();
      }
    });
  }

  /* ---- sidebar mobile ----------------------------------------------------- */
  function closeSidebar() { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }
  function initUi() {
    $('#hamburger').addEventListener('click', function () { $('#sidebar').classList.toggle('open'); $('#overlay').classList.toggle('show'); });
    $('#overlay').addEventListener('click', closeSidebar);
    $('#themeToggle').addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme');
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    });
    var kbd = navigator.platform.toLowerCase().indexOf('mac') !== -1 ? '⌘K' : '/';
    $('#searchKbd').textContent = kbd;
    if (BOOT.user) {
      $('#userName').textContent = BOOT.user.displayName;
      $('#userRole').textContent = BOOT.user.role;
      $('#userAvatar').textContent = (BOOT.user.displayName || '?').charAt(0).toUpperCase();
    }
  }

  /* ---- not-configured screen ---------------------------------------------- */
  function renderNotConfigured() {
    $('#nav').innerHTML = '';
    $('#view').innerHTML = '<div class="page-title">Setup required</div>'
      + '<div class="glass card" style="margin-top:10px;"><p>The portal database has not been configured yet. An administrator must run the one-time setup from the Apps Script editor:</p>'
      + '<pre style="background:var(--glass-bg);padding:14px;border-radius:10px;overflow:auto;">setup({ libraryFolderId: \'YOUR_DRIVE_FOLDER_ID\' })</pre>'
      + '<p class="muted" style="font-size:13px;">This creates the Google Sheets database, builds the schema and seeds the document catalogue. See docs/DEPLOYMENT.md for full instructions.</p></div>';
  }

  /* ---- boot --------------------------------------------------------------- */
  applyTheme(localStorage.getItem('theme') || 'system');
  initUi();
  if (!BOOT.configured) { renderNotConfigured(); return; }
  if (BOOT.error) { $('#view').innerHTML = errorBox('Initialisation error: ' + BOOT.error); }
  renderNav();
  wireGlobalSearch();
  window.addEventListener('hashchange', route);
  if (!location.hash) { location.hash = '#/dashboard'; } else { route(); }

})();
</script>
